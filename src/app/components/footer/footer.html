<footer class="footer">
  <div class="container footer__grid">
    <div class="footer__brand">
      <app-logo variant="light" />
      <p class="footer__about">{{ t(copy.about) }}</p>
      <a class="footer__social" [href]="linkedin" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6.6 9.4H3.9V20h2.7zM5.2 4a1.7 1.7 0 1 0 0 3.4 1.7 1.7 0 0 0 0-3.4M20.1 20v-6c0-3.1-1.7-4.6-3.9-4.6-1.8 0-2.6 1-3 1.7V9.4H10.5V20h2.7v-5.8c0-1.4.6-2.3 1.9-2.3s1.7 1 1.7 2.3V20z" fill="currentColor" />
        </svg>
      </a>
    </div>

    @for (column of columns; track column.title.en) {
      <nav class="footer__col" [attr.aria-label]="t(column.title)">
        <h4>{{ t(column.title) }}</h4>
        <ul>
          @for (link of column.links; track link.label.en) {
            <li>{{ t(link.label) }}</li>
          }
        </ul>
      </nav>
    }
  </div>

  <div class="container footer__bar">
    <p>© {{ year }} {{ t(copy.rights) }}</p>
    <div class="footer__legal">
      <span>{{ t(copy.privacy) }}</span>
      <span>{{ t(copy.terms) }}</span>
    </div>
  </div>
</footer>
