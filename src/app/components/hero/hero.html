<section class="hero" id="home" (mouseenter)="pause()" (mouseleave)="play()">
  <div class="container hero__stage">
    @for (slide of slides; track $index; let i = $index) {
      <article class="hero__slide" [class.is-active]="active() === i" [attr.aria-hidden]="active() !== i">
        <div class="hero__copy">
          <h1 class="hero__title">{{ t(slide.title) }}</h1>
          <div class="hero__text">
            @for (p of slide.paragraphs; track $index) {
              <p>{{ t(p) }}</p>
            }
          </div>
          <div class="hero__actions">
            <a class="btn btn--primary" routerLink="/contact">{{ t(labels.consult) }} <span class="arrow"><svg viewBox="0 0 12 10" aria-hidden="true"><path d="M1 5L11 5M1 5L5 1M1 5L5 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>
            <a class="btn btn--ghost" routerLink="/services">{{ t(labels.explore) }}</a>
          </div>
        </div>

        <div class="hero__art">
          <app-lottie
            class="art"
            [src]="slide.art.src"
            [ratio]="slide.art.ratio"
            [playing]="active() === i"
            [label]="t(slide.art.label)" />
        </div>
      </article>
    }
  </div>

  <div class="hero__controls">

    <button type="button" class="hero__arrow" (click)="step(-1)" [attr.aria-label]="t(labels.prev)">
      <svg viewBox="0 0 8 14" aria-hidden="true"><path d="M1.4 1L7 7L1.4 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="hero__dots" role="tablist" [attr.aria-label]="t(labels.slides)">
      @for (slide of slides; track $index; let i = $index) {
        <button
          type="button"
          class="hero__dot"
          [class.is-active]="active() === i"
          (click)="goTo(i)"
          role="tab"
          [attr.aria-selected]="active() === i"
          [attr.aria-label]="(isArabic() ? 'الشريحة ' : 'Slide ') + (i + 1)"></button>
      }
    </div>

    <button type="button" class="hero__arrow" (click)="step(1)" [attr.aria-label]="t(labels.next)">
      <svg viewBox="0 0 8 14" aria-hidden="true"><path d="M6.6 1L1 7L6.6 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

  </div>
</section>
