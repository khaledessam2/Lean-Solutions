<section class="section section--dark clients" id="clients">
  <div class="container">
    <div class="head-block" appReveal>
      <span class="eyebrow">{{ t(copy.eyebrow) }}</span>
      <h2 class="section-title">{{ t(copy.title) }}</h2>
      <p class="section-lead">{{ t(copy.lead) }}</p>
    </div>

    <ul class="clients__grid" appReveal>
      @for (client of clients; track client.name.en) {
        <li class="client">
          <img class="client__logo" [src]="client.logo" [alt]="t(client.name)" loading="lazy" />
        </li>
      }
    </ul>
  </div>
</section>
