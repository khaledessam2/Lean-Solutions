<section class="section section--dark services" id="services">
  <div class="container">
    <div class="head-block services__head" appReveal>
      <span class="eyebrow">{{ t(copy.eyebrow) }}</span>
      <h2 class="section-title">{{ t(copy.title) }}</h2>
    </div>

    <div class="tabs" appReveal role="tablist" [attr.aria-label]="t(copy.tabs)">
      @for (f of filters; track f.key) {
        <button
          type="button"
          class="tab"
          [class.is-active]="activeFilter() === f.key"
          role="tab"
          [attr.aria-selected]="activeFilter() === f.key"
          (click)="setFilter(f.key)">
          {{ t(f.label) }}
        </button>
      }
    </div>

    <div class="viewport">
      <div class="track" [style.transform]="shift()">
        @for (service of filtered(); track service.title.en) {
          <div class="slot">
            <article class="scard">
              <img
                class="scard__icon"
                [src]="service.icon"
                alt=""
                width="60"
                height="60"
                loading="lazy"
                decoding="async" />

              <h3 class="scard__title">{{ t(service.title) }}</h3>
              <p class="scard__text">{{ t(service.text) }}</p>
              <a
                class="scard__more"
                [routerLink]="service.hasDetail ? ['/services', service.slug] : ['/']"
                [fragment]="service.hasDetail ? undefined : 'contact'">{{ t(copy.read) }} <span class="arrow"><svg viewBox="0 0 12 10" aria-hidden="true"><path d="M1 5L11 5M1 5L5 1M1 5L5 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>
            </article>
          </div>
        }
      </div>
    </div>

    <div class="services__foot">
      <div class="services__arrows">
        <button type="button" class="nav-btn" (click)="step(-1)" [disabled]="index() === 0" [attr.aria-label]="t(copy.prev)">
          <svg viewBox="0 0 12 10" aria-hidden="true"><path d="M11 5L1 5M11 5L7 1M11 5L7 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="nav-btn" (click)="step(1)" [disabled]="index() >= maxIndex()" [attr.aria-label]="t(copy.next)">
          <svg viewBox="0 0 12 10" aria-hidden="true"><path d="M1 5L11 5M1 5L5 1M1 5L5 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <a class="btn btn--primary" routerLink="/services">{{ t(copy.more) }} <span class="arrow"><svg viewBox="0 0 12 10" aria-hidden="true"><path d="M1 5L11 5M1 5L5 1M1 5L5 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>
    </div>
  </div>
</section>
